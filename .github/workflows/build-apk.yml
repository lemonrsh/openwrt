name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle.log 2>&1 || {
            ERR=$(grep -E "^e: " gradle.log | head -n 30)
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 35 gradle.log)
            fi
            echo "=== GRADLE ERROR ==="
            echo "$ERR"
            gh release edit v1.0.0 --notes "BUILD_ERROR: $ERR" || true
            exit 1
          }
          mkdir -p release_apk
          echo "=== Found APKs ==="
          find . -name "*.apk" -ls
          find app/build -name "*.apk" -exec cp -v {} release_apk/openwrt-scanner.apk \;
          cp -v release_apk/openwrt-scanner.apk release_apk/OpenWrtScanner-v1.0.0.apk || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-scanner-debug-apk
          path: release_apk/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "release_apk/openwrt-scanner.apk" ]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
            if [ -z "$TARGET_TAG" ]; then
              TARGET_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "v1.0.0")
            fi
            echo "Uploading APK to GitHub Release: $TARGET_TAG"
            gh release upload "$TARGET_TAG" release_apk/openwrt-scanner.apk release_apk/OpenWrtScanner-v1.0.0.apk --clobber || true
          else
            echo "No APK found in release_apk/"
          fi
